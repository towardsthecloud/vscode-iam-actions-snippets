name: Update and publish IAM extension
on:
  workflow_dispatch:
  schedule:
    - cron: "10 9 * * 5"
  push:
    branches: [main]
    paths:
      - src/**
      - snippets/**
      - scripts/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - .vscodeignore
      - .nvmrc
      - .github/workflows/main.yml
permissions:
  contents: write
concurrency:
  group: iam-extension-release
  cancel-in-progress: false
jobs:
  prepare:
    outputs:
      release: ${{ steps.changes.outputs.release }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: python -m pip install -r src/requirements.txt
      - run: npm ci
      - run: npm run test:python
      - name: Fetch a complete IAM catalog
        run: python src/update-iam-action-snippets.py --workers 12
      - name: Check whether a release is needed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ] || ! git diff --quiet -- snippets/iam-actions.json; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare release version
        if: steps.changes.outputs.release == 'true'
        run: |
          npm version minor --no-git-tag-version
          gitchangelog > CHANGELOG.md
      - name: Validate the release catalog
        run: npm run validate:catalog
      - name: Test the release VSIX on minimum and stable VS Code
        if: steps.changes.outputs.release == 'true'
        shell: bash
        run: |
          mkdir -p .vscode-test/results
          xvfb-run -a npm test -- 1.85.0 2>&1 | tee .vscode-test/results/1.85.0.log
          xvfb-run -a node scripts/test-vscode.cjs stable 2>&1 | tee .vscode-test/results/stable.log
      - uses: actions/upload-artifact@v7.0.2
        if: always() && steps.changes.outputs.release == 'true'
        with:
          name: tested-release
          path: |
            .vscode-test/iam-actions.vsix
            .vscode-test/results/
      - name: Commit the validated release
        if: steps.changes.outputs.release == 'true'
        run: |
          git config user.name 'Github Actions'
          git config user.email 'danny@towardsthecloud.com'
          package_version=$(node -p "require('./package.json').version")
          git add snippets/iam-actions.json package.json package-lock.json CHANGELOG.md
          git commit -m "build: auto-update snippets to version: $package_version"
          git tag "$package_version"
          git push --atomic origin HEAD:main "$package_version"
  publish:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: https://marketplace.visualstudio.com
            token: VSCE_TOKEN
            name: marketplace
          - registry: https://open-vsx.org
            token: OPEN_VSX_TOKEN
            name: open-vsx
    name: Publish to ${{ matrix.name }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tested-release
          path: .vscode-test
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - uses: HaaLeo/publish-vscode-extension@v2.1.0
        with:
          pat: ${{ secrets[matrix.token] }}
          registryUrl: ${{ matrix.registry }}
          extensionFile: .vscode-test/iam-actions.vsix
          skipDuplicate: true
