name: Validate extension
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: extension-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        vscode: ["1.85.0", "stable"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src/requirements.txt
      - run: npm ci
      - run: python -m pip install -r src/requirements.txt
      - run: npm run test:python
      - run: npm run validate:catalog
      - name: Test the packaged extension
        shell: bash
        run: |
          mkdir -p .vscode-test/results
          xvfb-run -a npm test -- '${{ matrix.vscode }}' 2>&1 | tee '.vscode-test/results/${{ matrix.vscode }}.log'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extension-${{ matrix.vscode }}
          path: |
            .vscode-test/iam-actions.vsix
            .vscode-test/results/
